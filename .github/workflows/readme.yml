name: Generate README

on:
  push:
    branches: [main]
    paths:
      - projects.toml
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Skip runs triggered by our own auto-commit (pushes with GITHUB_TOKEN do not
    # trigger workflows anyway, and README.md is not in the paths filter).
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate README
        run: python scripts/generate.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- README.md)" ]; then
            echo "README.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate README.md"
          git push
